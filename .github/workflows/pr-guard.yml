name: PR Hygiene & Guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-commits:
    name: Validate Conventional Commits Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            sec
            perf
            refactor
            docs
            test
            chore
            ci
          requireScope: false

  pr-size-labeler:
    name: Categorize PR Size (Auditability)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: PR Size Analysis
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: '20'
          s_max_size: '100'
          m_max_size: '300'
          l_max_size: '800'
          fail_if_xl: 'false'

  auto-module-labeler:
    name: Auto-Label Changed Subsystems
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply Subsystem Labels
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true
