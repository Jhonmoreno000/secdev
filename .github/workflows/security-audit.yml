name: Security & DevSecOps Audit

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Key Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  sast-analysis:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Security Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/c
            p/cpp
        continue-on-error: true

  sbom-generation:
    name: Supply Chain Security & SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Software Bill of Materials (SPDX / CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: 'spdx-json'
          output-file: 'secdev-sbom.spdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secdev-sbom
          path: secdev-sbom.spdx.json
          retention-days: 14
